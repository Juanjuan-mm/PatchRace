name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to publish
        required: true
        type: string

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Verify, publish, and attest
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install pinned release tooling
        run: |
          npm install --global corepack@0.35.0 npm@11.5.1 --force
          corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify immutable release identity
        run: node scripts/verify-release-ref.mjs "${{ inputs.tag }}"
      - name: Run full release gates
        run: pnpm verify
      - name: Publish audited tarballs
        env:
          # NPM_TOKEN is required only to bootstrap package names. After the
          # first release, configure this workflow as each package's npm
          # trusted publisher and remove the environment secret.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          npm publish .artifacts/packages/patchrace-contracts-*.tgz --access public
          npm publish .artifacts/packages/patchrace-core-*.tgz --access public
          npm publish .artifacts/packages/patchrace-adapters-*.tgz --access public
          npm publish .artifacts/packages/patchrace-tasks-*.tgz --access public
          npm publish .artifacts/packages/patchrace-diagnosis-*.tgz --access public
          npm publish .artifacts/packages/patchrace-optimizer-*.tgz --access public
          npm publish .artifacts/packages/patchrace-report-*.tgz --access public
          npm publish ".artifacts/packages/patchrace-${RELEASE_VERSION}.tgz" --access public
          npm publish .artifacts/packages/pi-patchrace-*.tgz --access public
      - name: Verify registry bytes
        run: node scripts/verify-published-release.mjs
      - name: Verify clean registry install
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          npm install --global "patchrace@${RELEASE_VERSION}"
          patchrace --version
          patchrace --help
      - name: Publish GitHub release and audited artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "PatchRace $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
          gh release upload "$RELEASE_TAG" \
            .artifacts/packages/*.tgz \
            .artifacts/release-packages.json \
            .artifacts/published-release.json
