name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to publish
        required: true
        type: string

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Verify, publish, and attest
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install pinned release tooling
        run: |
          npm install --global corepack@0.35.0 npm@11.5.1 --force
          corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify immutable release identity
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/verify-release-ref.mjs "$RELEASE_TAG"
      - name: Run full release gates
        run: pnpm verify
      - name: Publish audited tarballs
        env:
          # NPM_TOKEN is required only to bootstrap package names. After the
          # first release, configure this workflow as each package's npm
          # trusted publisher and remove the environment secret.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          publish_if_missing() {
            PACKAGE_NAME="$1"
            TARBALL="$2"
            if npm view "${PACKAGE_NAME}@${RELEASE_VERSION}" version >/dev/null 2>&1; then
              echo "${PACKAGE_NAME}@${RELEASE_VERSION} is already published; registry-byte verification will validate it."
            else
              npm publish "$TARBALL" --access public
            fi
          }
          publish_if_missing "@patchrace/contracts" .artifacts/packages/patchrace-contracts-*.tgz
          publish_if_missing "@patchrace/core" .artifacts/packages/patchrace-core-*.tgz
          publish_if_missing "@patchrace/adapters" .artifacts/packages/patchrace-adapters-*.tgz
          publish_if_missing "@patchrace/tasks" .artifacts/packages/patchrace-tasks-*.tgz
          publish_if_missing "@patchrace/diagnosis" .artifacts/packages/patchrace-diagnosis-*.tgz
          publish_if_missing "@patchrace/optimizer" .artifacts/packages/patchrace-optimizer-*.tgz
          publish_if_missing "@patchrace/report" .artifacts/packages/patchrace-report-*.tgz
          publish_if_missing "patchrace" ".artifacts/packages/patchrace-${RELEASE_VERSION}.tgz"
          publish_if_missing "pi-patchrace" .artifacts/packages/pi-patchrace-*.tgz
      - name: Verify registry bytes
        run: node scripts/verify-published-release.mjs
      - name: Verify clean registry install
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          npm install --global "patchrace@${RELEASE_VERSION}"
          patchrace --version
          patchrace --help
      - name: Publish GitHub release and audited artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "PatchRace $RELEASE_TAG" \
              --notes-file "docs/releases/$RELEASE_TAG.md"
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "PatchRace $RELEASE_TAG" \
              --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" \
            --clobber \
            .artifacts/packages/*.tgz \
            .artifacts/release-packages.json \
            .artifacts/published-release.json
